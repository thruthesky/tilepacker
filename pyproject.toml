[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tilepacker"
version = "0.1.0"
description = "Pack loose tile images into a uniform-grid tileset (PNG + .tsx/.tsj) for the Tiled map editor."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "thruthesky", email = "thruthesky@gmail.com" }]
keywords = ["tiled", "tileset", "tilemap", "gamedev", "spritesheet", "packer", "flame"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "Pillow>=10.0.0",
    "PySide6>=6.5.0",
]

[project.optional-dependencies]
# numpy accelerates background removal / duplicate detection. Without it the
# code falls back to pure Pillow with identical results.
fast = ["numpy>=1.24.0"]
dev = ["pytest>=7.0", "numpy>=1.24.0"]

[project.scripts]
tilepacker = "tilepacker.cli:main"
tilepacker-gui = "tilepacker.gui_app:launch"
tilepacker-gui2 = "tilepacker.gui2:launch"

[project.urls]
Homepage = "https://github.com/thruthesky/tilepacker"
Repository = "https://github.com/thruthesky/tilepacker"

[tool.setuptools.packages.find]
include = ["tilepacker*"]

[tool.setuptools.package-data]
# Bundled app icon; without this the PNG is silently dropped from wheels.
"tilepacker.assets" = ["*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
